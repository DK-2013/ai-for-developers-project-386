# Local development Postgres credentials are not secrets.
# Keep this allowlist narrow: only these paths and only the local connection shape.
# review 2027-01-31: re-check whether these credentials are still local-only.
filter = '''
(
    filter.matchesAny(attributes["path"], [
        `(^|/)\.env\.example$`,
        `(^|/)docker-compose\.yml$`,
        `(^|/)docker/entrypoint\.sh$`,
        `(^|/)mise\.toml$`,
        `(^|/)README\.md$`,
        `(^|/)\.github/workflows/quality\.yml$`,
        `(^|/)packages/server/src/config\.ts$`,
        `(^|/)packages/server/src/config\.test\.ts$`,
        `(^|/)packages/server/test/helpers/database\.ts$`,
    ]) &&
    (
        filter.findMatch(finding["secret"], `^postgres(?:ql)?://postgres:postgres@(?:localhost|db):5432/`) != "" ||
        finding["secret"] == "postgres"
    )
)
'''

[extend]
useDefault = true
