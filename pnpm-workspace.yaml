  - "@oxfmt/binding-linux-arm-musleabihf@0.78.0"
  - "@oxfmt/binding-linux-arm64-gnu@0.78.0"
  - "@oxfmt/binding-linux-arm64-musl@0.78.0"
  - "@oxfmt/binding-linux-ppc64-gnu@0.78.0"
