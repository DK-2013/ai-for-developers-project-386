# Long-form Russian prose and wide tables do not fit a fixed column limit, so
# MD013 would only produce noise. Everything else follows the defaults.
# review 2026-11-05: CHANGELOG.md is generated by release-please with two blank
# lines between sections and must not be hand-edited, so linting it is noise.
[global]
exclude = [".agents/**", ".idea/**", "node_modules/**", "**/dist/**", "CHANGELOG.md"]
disable = ["MD013"]

# README uses <details>/<summary> for collapsible sections.
[MD033]
allowed-elements = ["details", "summary"]
