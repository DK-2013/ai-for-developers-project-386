name: security

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install toolchain
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: true

      - name: Scan dependencies for vulnerabilities
        run: mise run check:osv

      - name: Scan secrets in git history
        run: betterleaks git . --config .betterleaks.toml --no-banner --redact=100

      - name: Check links
        run: mise run check:links

      - name: Check suppression review dates
        run: node scripts/check-suppression-dates.mjs
