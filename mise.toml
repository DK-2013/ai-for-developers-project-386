[settings]
experimental = true

[tools]
gh = "latest"
node = "26"
pnpm = "10.34.9"
"npm:@tobilu/qmd" = "latest"
"npm:@playwright/mcp" = "0.0.84"
"npm:chrome-devtools-mcp" = "1.12.0"
"npm:playwright" = "1.64.1"
hk = "2.10.0"
jactionlint = "2.4.0"
betterleaks = "1.9.0"
osv-scanner = "2.7.0"
hadolint = "2.15.1"
shellcheck = "0.11.0"
typos = "1.51.1"
rumdl = "0.3.2"
vacuum = "0.36.0"

[tools."github:lycheeverse/lychee"]
version = "0.24.2"
version_prefix = "lychee-v"

[tools."github:lycheeverse/lychee".platforms]
linux-x64 = { asset_pattern = "lychee-x86_64-unknown-linux-musl.tar.gz" }

[daemons.db]
run = "exec docker compose up db"
ready_port = 5432

[tasks.setup]
description = "Start PostgreSQL, install dependencies, generate code and install hooks"
run = "docker compose up -d --wait db && pnpm install && pnpm codegen && hk install"

[tasks.dev]
description = "Start the API and the web app in watch mode"
daemons = ["db"]
run = "pnpm dev"

[tasks.codegen]
description = "Generate OpenAPI, server router and client SDK from TypeSpec"
run = "pnpm codegen"

[tasks."db:up"]
description = "Start PostgreSQL"
run = "docker compose up -d --wait db"

[tasks."db:down"]
description = "Stop local containers"
run = "docker compose down"

[tasks.test]
description = "Run unit and integration tests"
daemons = ["db"]
run = "pnpm test"

[tasks."mcp:browsers"]
description = "Install the Chromium builds used by Playwright and the browser MCP servers"
run = [
  # @playwright/mcp@0.0.84 bundles Playwright 1.65.0-alpha, which needs chromium-1252.
  "playwright-mcp install-browser chrome-for-testing",
  # playwright and @playwright/test 1.64.1 need chromium-1248.
  "playwright install chromium",
]

[tasks."mcp:check"]
description = "Verify both browser MCP servers handshake and launch Chromium"
run = "node scripts/mcp-check.mjs"

[tasks.build]
description = "Build server and web"
run = "pnpm build"

[tasks."docker:up"]
description = "Build and run the whole app in Docker"
run = "docker compose up --build"

[tasks.check]
description = "Run every quality check (starts PostgreSQL via the db daemon)"
depends = ["codegen"]
daemons = ["db"]
run = "hk check --all"

[tasks."check:fast"]
description = "Run fast checks on staged files"
run = "hk run pre-commit --staged --check"

[tasks."hooks:install"]
description = "Install Git hooks managed by hk"
run = "hk install"

[tasks."check:links"]
description = "Check links in Markdown files"
run = "hk run links --all"

[tasks."check:osv"]
description = "Scan dependencies for known vulnerabilities"
run = "osv-scanner scan source -r ."

[tasks.fix]
description = "Apply safe autofixes"
run = "hk fix --all"
